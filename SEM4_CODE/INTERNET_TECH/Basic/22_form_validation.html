<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22: Client-Side Form Validation</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        .error { color: #dc2626; font-size: 0.85rem; margin-top: 4px; display: none; }
        button { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>User Registration Form</h2>
    <form id="regForm">
        <div class="form-group">
            <label for="username">Username (min 4 chars):</label>
            <input type="text" id="username">
            <div id="userError" class="error">Username must be at least 4 characters long.</div>
        </div>
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email">
            <div id="emailError" class="error">Please enter a valid email address.</div>
        </div>
        <div class="form-group">
            <label for="password">Password (min 6 chars):</label>
            <input type="password" id="password">
            <div id="passError" class="error">Password must have at least 6 characters.</div>
        </div>
        <button type="submit">Submit Form</button>
    </form>

    <script>
        document.getElementById("regForm").addEventListener("submit", (e) => {
            e.preventDefault();
            let isValid = true;

            const u = document.getElementById("username").value.trim();
            const em = document.getElementById("email").value.trim();
            const p = document.getElementById("password").value;

            const uErr = document.getElementById("userError");   // Validate username length
            if (u.length < 4) {
                uErr.style.display = "block";
                isValid = false;
            } else {
                uErr.style.display = "none";
            }

            const emErr = document.getElementById("emailError"); // Validate email format via regex
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(em)) {
                emErr.style.display = "block";
                isValid = false;
            } else {
                emErr.style.display = "none";
            }

            const pErr = document.getElementById("passError");   // Validate password length
            if (p.length < 6) {
                pErr.style.display = "block";
                isValid = false;
            } else {
                pErr.style.display = "none";
            }

            if (isValid) {
                alert("Form submitted successfully!");
            }
        });
    </script>
</body>
</html>
