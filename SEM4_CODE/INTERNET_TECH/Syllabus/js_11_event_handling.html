<!DOCTYPE html>
<html>
<head><title>Event Handling Demo</title></head>
<body>
    <button id="btn" onclick="handleClick()">Click Me</button>
    <p id="msg"></p>
    <script>
        function handleClick() {
            document.getElementById("msg").innerText = "Button was clicked!";
        }
    </script>
</body>
</html>
